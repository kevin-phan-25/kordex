apiVersion: operations.kordex.local/v1alpha1
kind: MaintenancePolicy
metadata:
  name: gke-stateless-workers
  namespace: kordex-system
spec:
  nodeSelector:
    matchLabels:
      operations.kordex.local/maintenance: stateless
  suspended: false
  # Explicit opt-in to the narrow GKE add-on availability evaluator.
  # Matching PDBs remain authoritative.
  allowGKESystemWorkloads: true
  gkeSystemWorkloadMinAvailable: 1
  recoverySeconds: 10
  gracePeriodSeconds: 30
