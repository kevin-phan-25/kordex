name: kordex
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kordex_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      KORDEX_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/kordex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            control-plane/go.sum
            agent/go.sum
            api/go.sum
            operator/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l api control-plane agent operator integrations)"
      - name: Generated API definitions are current
        run: |
          make generate
          git diff --exit-code -- api/operations operator/config/crd deployments/helm/kordex-operator/crds
      - run: make contract
      - run: make vet build
      - name: Unit, API and PostgreSQL integration tests
        run: go test -race -count=1 -coverprofile=coverage.out ./api/... ./control-plane/... ./agent/... ./operator/... ./integrations/...
      - name: HTTP process restart smoke
        env:
          KORDEX_BINARY: ${{ github.workspace }}/bin/kordex
        run: python3 tests/integration/smoke.py
      - name: Dependency vulnerabilities
        run: |
          for module in api control-plane agent operator integrations; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...) || exit 1
          done
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [control-plane, agent, operator, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build unprivileged runtime image
        run: docker build -f ${{ matrix.component }}/Dockerfile -t kordex:ci .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: kordex:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm audit --audit-level=high
        working-directory: dashboard
      - run: npm run typecheck
        working-directory: dashboard
      - run: npm run lint
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  envtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            api/go.sum
            operator/go.sum
      - name: Real API-server admission and controller tests
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.3-0.20261103101737-9603adbb18be
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.37.0 -p path)"
          make envtest

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: >-
          helm lint deployments/helm/kordex-agent
          --set controlPlaneURL=https://hub.example
          --set clusterID=80bd80f9-f097-4474-86f4-b80986fd5423
          --set enrollmentSecretName=enrollment
          --set maintenance.enabled=true
      - run: >-
          helm lint deployments/helm/kordex-operator
          --set clusterID=80bd80f9-f097-4474-86f4-b80986fd5423
          --set hubPublicKeysConfigMap=hub-trust

      - run: >-
          helm lint deployments/helm/kordex-dashboard
          --set image.repository=ghcr.io/acme/kordex-dashboard
          --set dashboardURL=https://dashboard.example.com
          --set apiURL=https://api.example.com
          --set oidc.issuer=https://identity.example.com
          --set oidc.clientID=kordex-dashboard
          --set oidc.secretName=kordex-dashboard-identity
      - run: >-
          helm lint deployments/helm/kordex-control-plane
          --set credentialsSecretName=kordex-credentials
          --set oidc.issuer=https://identity.example
          --set oidc.audience=kordex

  kind-registration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kordex_kind
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      KORDEX_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/kordex_kind?sslmode=disable
      KUBECONFIG: /tmp/kordex-kind.kubeconfig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            control-plane/go.sum
            agent/go.sum
            api/go.sum
            operator/go.sum
      - run: make build
      - name: Create disposable Kubernetes cluster
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o /tmp/kordex-kind
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kordex-kind' | sha256sum -c -
          chmod +x /tmp/kordex-kind
          /tmp/kordex-kind create cluster --name kordex-registration --config tests/kind/maintenance.yaml --wait 90s --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: Real agent registration and restart
        env:
          KORDEX_BINARY: ${{ github.workspace }}/bin/kordex
          KORDEX_AGENT_BINARY: ${{ github.workspace }}/bin/kordex-agent
        run: python3 tests/integration/registration_smoke.py
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0
      - name: Real PDB-aware maintenance drill with chart RBAC
        env:
          KORDEX_BINARY: ${{ github.workspace }}/bin/kordex
          KORDEX_AGENT_BINARY: ${{ github.workspace }}/bin/kordex-agent
          KORDEX_OPERATOR_BINARY: ${{ github.workspace }}/bin/kordex-operator
          KORDEX_KEYGEN_BINARY: ${{ github.workspace }}/bin/kordex-keygen
          KORDEX_SCHEDULER_BINARY: ${{ github.workspace }}/bin/kordex-scheduler
          KORDEX_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/kordex_maintenance?sslmode=disable
          KUBECTL: kubectl
          HELM: helm
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres kordex_maintenance
          python3 tests/integration/maintenance_smoke.py
      - name: Delete disposable cluster
        if: always()
        run: /tmp/kordex-kind delete cluster --name kordex-registration
