apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kordex-agent.name" . }}-identity
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- /* Preserve private identity on Helm upgrade, never replace it with an empty Secret. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-identity" (include "kordex-agent.name" .)) }}
{{- if $existing }}
data:
{{ toYaml $existing.data | indent 2 }}
{{- else }}
data: {}
{{- end }}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ include "kordex-agent.name" . }}
spec: {}
