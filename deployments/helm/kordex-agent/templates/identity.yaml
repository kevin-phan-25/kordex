{{- /* Existing identity is retained, never rendered back into a Helm-managed data snapshot. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-identity" (include "kordex-agent.name" .)) }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kordex-agent.name" . }}-identity
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Public CAS bootstrap value (base64 for {}). The lookup above ensures Helm
  # never renders this seed over an existing, agent-owned identity.
  state.json: e30=
{{- end }}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ include "kordex-agent.name" . }}
{{- if .Values.maintenance.enabled }}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: kordex-hub-connection
{{- end }}
