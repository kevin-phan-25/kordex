{{- $url := required "controlPlaneURL must be configured" .Values.controlPlaneURL -}}
{{- if not (hasPrefix "https://" $url) -}}{{ fail "controlPlaneURL must use HTTPS" }}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kordex-agent.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: kordex-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: kordex-agent
    spec:
      serviceAccountName: {{ include "kordex-agent.name" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 80
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "kordex-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml .Values.resources | indent 12 }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          env:
{{- if .Values.maintenance.enabled }}
            - name: KORDEX_ENABLE_MAINTENANCE
              value: "true"
{{- end }}
            - name: KORDEX_CONTROL_PLANE_URL
              value: {{ $url | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: KORDEX_CLUSTER_ID
              value: {{ required "clusterID required" .Values.clusterID | quote }}
            - name: KORDEX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: KORDEX_STATE_SECRET
              value: {{ include "kordex-agent.name" . }}-identity
            - name: KORDEX_STATE_SECRET_FILE
              value: /var/run/kordex/identity/state.json
            - name: KORDEX_LEASE_NAME
              value: {{ include "kordex-agent.name" . }}
            - name: KORDEX_ENROLLMENT_TOKEN_FILE
              value: /var/run/kordex/enrollment/token
{{- if .Values.caSecretName }}
            - name: KORDEX_CA_FILE
              value: /var/run/kordex/ca/ca.crt
{{- end }}
          volumeMounts:
            - name: enrollment
              mountPath: /var/run/kordex/enrollment
              readOnly: true
            - name: identity
              mountPath: /var/run/kordex/identity
              readOnly: true
{{- if .Values.caSecretName }}
            - name: ca
              mountPath: /var/run/kordex/ca
              readOnly: true
{{- end }}
      volumes:
        - name: enrollment
          secret:
            secretName: {{ required "enrollmentSecretName required" .Values.enrollmentSecretName }}
            defaultMode: 0444
            items:
              - key: token
                path: token
        - name: identity
          secret:
            secretName: {{ include "kordex-agent.name" . }}-identity
            defaultMode: 0440
            optional: true
            items:
              - key: state.json
                path: state.json
{{- if .Values.caSecretName }}
        - name: ca
          secret:
            secretName: {{ .Values.caSecretName }}
{{- end }}
