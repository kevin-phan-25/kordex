{{- $url := required "controlPlaneURL must be configured" .Values.controlPlaneURL -}}
{{- if not (hasPrefix "https://" $url) -}}{{ fail "controlPlaneURL must use HTTPS" }}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kordex-agent.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: kordex-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: kordex-agent
    spec:
      serviceAccountName: {{ include "kordex-agent.name" . }}
      terminationGracePeriodSeconds: 80
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml .Values.resources | indent 12 }}
          env:
            - name: KORDEX_CONTROL_PLANE_URL
              value: {{ $url | quote }}
            - name: KORDEX_CLUSTER_ID
              value: {{ required "clusterID required" .Values.clusterID | quote }}
            - name: KORDEX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: KORDEX_STATE_SECRET
              value: {{ include "kordex-agent.name" . }}-identity
            - name: KORDEX_LEASE_NAME
              value: {{ include "kordex-agent.name" . }}
            - name: KORDEX_ENROLLMENT_TOKEN_FILE
              value: /var/run/kordex/enrollment/token
{{- if .Values.caSecretName }}
            - name: KORDEX_CA_FILE
              value: /var/run/kordex/ca/ca.crt
{{- end }}
          volumeMounts:
            - name: enrollment
              mountPath: /var/run/kordex/enrollment
              readOnly: true
{{- if .Values.caSecretName }}
            - name: ca
              mountPath: /var/run/kordex/ca
              readOnly: true
{{- end }}
      volumes:
        - name: enrollment
          secret:
            secretName: {{ required "enrollmentSecretName required" .Values.enrollmentSecretName }}
            defaultMode: 0444
{{- if .Values.caSecretName }}
        - name: ca
          secret:
            secretName: {{ .Values.caSecretName }}
{{- end }}
