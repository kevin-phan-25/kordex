apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kordex-agent.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kordex-agent.clusterRole" . }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system, {{ .Release.Namespace | quote }}]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes, storageclasses]
    verbs: [list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations, validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [list]
  - nonResourceURLs: [/version, /api, /api/*, /apis, /apis/*]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kordex-agent.clusterRole" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kordex-agent.clusterRole" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-agent.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kordex-agent.name" . }}-discovery
  namespace: kube-system
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kordex-agent.name" . }}-discovery
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kordex-agent.name" . }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-agent.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kordex-agent.name" . }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "kordex-agent.name" . }}-identity]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ include "kordex-agent.name" . }}]
    verbs: [get, update]
{{- if .Values.maintenance.enabled }}
  - apiGroups: [operations.kordex.local]
    resources: [maintenancepolicies]
    verbs: [get, list]
  - apiGroups: [operations.kordex.local]
    resources: [nodemaintenances]
    verbs: [get, list, create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-hub-connection]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-operator-capabilities]
    verbs: [get]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kordex-agent.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kordex-agent.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-agent.name" . }}
    namespace: {{ .Release.Namespace }}
