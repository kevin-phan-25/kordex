apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kordex-agent.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kordex-agent.clusterRole" . }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kordex-agent.clusterRole" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kordex-agent.clusterRole" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-agent.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kordex-agent.name" . }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "kordex-agent.name" . }}-identity]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ include "kordex-agent.name" . }}]
    verbs: [get, update]
{{- if .Values.maintenance.enabled }}
  - apiGroups: [operations.kordex.local]
    resources: [nodemaintenances]
    verbs: [get, list, create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-hub-connection]
    verbs: [get, update]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kordex-agent.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kordex-agent.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-agent.name" . }}
    namespace: {{ .Release.Namespace }}
