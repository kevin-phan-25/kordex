image:
  repository: kordex/agent
  tag: "0.4.0"
  digest: ""
  requireDigest: false
  pullPolicy: IfNotPresent
imagePullSecrets: []
controlPlaneURL: ""
clusterID: ""
# Create this Secret separately; key: token. It is never rendered into Helm values.
enrollmentSecretName: ""
# Optional existing Secret containing key ca.crt for a private management CA.
caSecretName: ""
telemetry:
  # Empty disables OTLP/HTTP export. Restricted egress must allow the reviewed collector.
  otlpEndpoint: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Opt-in only after operator CRDs/trust are installed in the same namespace.
maintenance:
  enabled: false

# Optional pod egress isolation. When enabled, list every required destination
# (including DNS, the Kubernetes API, and the configured management endpoint).
networkPolicy:
  egress:
    enabled: false
    rules: []
