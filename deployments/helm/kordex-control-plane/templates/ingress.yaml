{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ required "ingress.host must be set when ingress.enabled" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName must be set when ingress.enabled" .Values.ingress.tls.secretName | quote }}
  rules:
    - host: {{ required "ingress.host must be set when ingress.enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  name: http
{{- end }}
