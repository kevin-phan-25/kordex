image:
  repository: kordex/control-plane
  tag: "0.6.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
productName: Kordex
apiReplicas: 2
schedulerReplicas: 2
# Existing Secret with runtime databaseURL, migrationDatabaseURL and maintenanceSigningKey. Both database URLs require sslmode=verify-full.
# Create securely outside Helm; never place secret values in values.yaml.
credentialsSecretName: ""
oidc:
  issuer: ""
  audience: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
metrics:
  enabled: false
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring

apiRateLimitRPS: 20
apiRateLimitBurst: 600
