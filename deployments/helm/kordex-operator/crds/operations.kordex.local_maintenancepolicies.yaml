                format: int32
                maximum: 300
                minimum: 10
                type: integer
              suspended:
                type: boolean
              upgrade:
                description: Upgrade is the digest-pinned Ansible EE policy for self-managed
                  Linux nodes.
                properties:
                  actionMarkerVersion:
                    default: 1
                    description: |-
                      ActionMarkerVersion selects the durable host-side operation journal.
                      Version 1 is mandatory for every executable host-upgrade plan.
                    maximum: 1
                    minimum: 1
                    type: integer
                  artifactMode:
                    description: |-
                      ArtifactMode is required for schema version 2. OfflineArtifacts prohibits
