                          pattern: ^[a-f0-9]{64}$
                          type: string
                        name:
                          pattern: ^[a-z0-9][a-z0-9+_.-]{0,127}(:[a-z0-9][a-z0-9_-]{0,31})?$
                          type: string
                        version:
