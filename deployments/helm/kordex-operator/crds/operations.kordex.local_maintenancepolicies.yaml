                    type: object
                type: object
                x-kubernetes-map-type: atomic
              providerUpgrade:
                description: |-
                  ProviderUpgrade describes a provider-native node-pool upgrade. The local
                  operator requires an enabled provider adapter and validates the live pool
                  disruption settings against this signed plan before mutation.
                properties:
                  maxSurge:
                    description: |-
                      GKE surge settings are pinned in the policy digest and must match the
                      existing node-pool configuration before the provider update is submitted.
                      The first GKE adapter supports only one surge node and zero unavailable.
                    maximum: 1
                    minimum: 1
                    type: integer
                  maxUnavailable:
                    maximum: 0
                    minimum: 0
                    type: integer
                  provider:
                    type: string
                  resource:
                    type: string
                  schemaVersion:
