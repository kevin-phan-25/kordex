image:
  repository: kordex/operator
  tag: "0.4.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
clusterID: ""
# Existing ConfigMap with key keys.json, mapping SHA-256 key IDs to public keys.
hubPublicKeysConfigMap: ""
metrics:
  enabled: false
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
upgrade:
  # Disabled by default until each supported Debian and RHEL EE workflow has passed real VM qualification.
  enabled: false
  sshUser: ""
  sshCredentialSecret: ""
  knownHostsConfigMap: ""
  # Exact digest-pinned OCI references for reviewed Kordex EE builds.
  executionEnvironmentAllowlist: []
  # Optional Secret names in the operator namespace for private EE registries.
  imagePullSecrets: []
kured:
  # Coordinate with an existing reviewed kured DaemonSet; does not install it.
  enabled: false
  namespace: kube-system
  daemonSet: kured
  # Keep true during cleanup if disabling the interlock with operations pending.
  rbacEnabled: false
providerUpgrade:
  # GKE native node-pool updates are separately opt-in and require Workload Identity.
  gkeEnabled: false
  gcpServiceAccount: ""
etcd:
  # Configure only for reachable self-managed etcd endpoints. The TLS secret
  # must contain ca.crt, tls.crt, and tls.key. Empty endpoints keep CP work blocked.
  endpoints: []
  tlsSecretName: ""
rookMetrics:
  # Optional ConfigMap containing a private CA bundle under ca.crt for HTTPS manager metrics.
  caConfigMap: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
nodeSelector: {}
