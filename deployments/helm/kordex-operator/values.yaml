image:
  repository: kordex-operator
  tag: "0.4.0"
  pullPolicy: IfNotPresent
clusterID: ""
# Existing ConfigMap with key keys.json, mapping SHA-256 key IDs to public keys.
hubPublicKeysConfigMap: ""
metrics:
  enabled: false
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
nodeSelector: {}
