# This fixed namespace and non-expiring slot are shared across operator installations.
apiVersion: v1
kind: Namespace
metadata:
  name: kordex-operations-ledger
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: kordex-maintenance-cluster-slot
  namespace: kordex-operations-ledger
  annotations:
    helm.sh/resource-policy: keep
{{- $existing := lookup "coordination.k8s.io/v1" "Lease" "kordex-operations-ledger" "kordex-maintenance-cluster-slot" }}
{{- if $existing }}
spec:
{{ toYaml $existing.spec | indent 2 }}
{{- else }}
spec: {}
{{- end }}

---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: kordex-operator
{{- $leader := lookup "coordination.k8s.io/v1" "Lease" .Release.Namespace "kordex-operator" }}
{{- if $leader }}
spec:
{{ toYaml $leader.spec | indent 2 }}
{{- else }}
spec: {}
{{- end }}
