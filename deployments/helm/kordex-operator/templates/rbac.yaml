apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kordex-operator.name" . }}
{{ if .Values.providerUpgrade.gkeEnabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "providerUpgrade.gcpServiceAccount required when GKE upgrades are enabled" .Values.providerUpgrade.gcpServiceAccount | quote }}
{{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kordex-operator.clusterRole" . }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [pods, persistentvolumes, services]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews]
    verbs: [create]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [nodes, replicas, volumes]
    verbs: [get, list]
  - nonResourceURLs: [/readyz]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kordex-operator.clusterRole" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kordex-operator.clusterRole" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-operator.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kordex-operator.clusterRole" . }}-heartbeats
  namespace: kube-node-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kordex-operator.clusterRole" . }}-heartbeats
  namespace: kube-node-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kordex-operator.clusterRole" . }}-heartbeats
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-operator.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kordex-upgrade-runner
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kordex-operator.name" . }}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
  {{ if .Values.upgrade.enabled }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ required "upgrade.sshCredentialSecret required when upgrade.enabled" .Values.upgrade.sshCredentialSecret | quote }}]
    verbs: [get]
  {{ end }}
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [operations.kordex.local]
    resources: [nodemaintenances]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [operations.kordex.local]
    resources: [maintenancepolicies, maintenancecampaigns]
    verbs: [get, list, watch]
  - apiGroups: [operations.kordex.local]
    resources: [nodemaintenances/status, maintenancepolicies/status, maintenancecampaigns/status]
    verbs: [get, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-operator]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-hub-connection]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-operator-capabilities]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kordex-operator.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kordex-operator.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-operator.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kordex-operator.clusterRole" . }}-ledger
  namespace: kordex-operations-ledger
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-maintenance-cluster-slot]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kordex-operator.clusterRole" . }}-ledger
  namespace: kordex-operations-ledger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kordex-operator.clusterRole" . }}-ledger
subjects:
  - kind: ServiceAccount
    name: {{ include "kordex-operator.name" . }}
    namespace: {{ .Release.Namespace }}
