apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kordex-operator.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kordex-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordex-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "kordex-operator.name" . }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: operator
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: KORDEX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KORDEX_CLUSTER_ID
              value: {{ required "clusterID required" .Values.clusterID | quote }}
            - name: KORDEX_HUB_PUBLIC_KEYS_FILE
              value: /var/run/kordex-trust/keys.json
            - name: KORDEX_METRICS_ADDR
              value: {{ if .Values.metrics.enabled }}"0.0.0.0:8082"{{ else }}"127.0.0.1:8082"{{ end }}
          ports:
            - name: health
              containerPort: 8081
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 8082
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          volumeMounts:
            - name: hub-trust
              mountPath: /var/run/kordex-trust
              readOnly: true
      volumes:
        - name: hub-trust
          configMap:
            name: {{ required "hubPublicKeysConfigMap required" .Values.hubPublicKeysConfigMap }}
