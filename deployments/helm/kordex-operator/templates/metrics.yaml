{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kordex-operator.name" . }}-metrics
  labels:
    app.kubernetes.io/name: kordex-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8082"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kordex-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kordex-operator.name" . }}-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kordex-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8081}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.metrics.namespaceSelector | nindent 12 }}
      ports:
        - {protocol: TCP, port: 8082}
{{- end }}
