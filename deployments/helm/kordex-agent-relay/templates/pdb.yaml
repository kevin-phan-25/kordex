{{- if ge (int .Values.replicas) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kordex-agent-relay.name" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kordex-agent-relay
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
