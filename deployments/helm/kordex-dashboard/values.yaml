replicaCount: 2
image:
  repository: ""
  tag: "0.8.0"
  digest: ""
  requireDigest: false
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  type: ClusterIP
  port: 3000
productName: Kordex
apiURL: ""
dashboardURL: ""
oidc:
  issuer: ""
  clientID: ""
  apiTokenMode: id_token
  apiScopes: ""
  # Secret must contain key session-secret with at least 32 random bytes.
  secretName: kordex-dashboard-identity
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    secretName: ""
networkPolicy:
  ingress:
    enabled: false
    dashboardFrom: []
  egress:
    enabled: false
    commonTo: []
    dashboardTo: []
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 1000m, memory: 512Mi}
