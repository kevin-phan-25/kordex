apiVersion: v1
kind: Service
metadata:
  name: {{ include "kordex-dashboard.fullname" . }}
  labels: {{- include "kordex-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "kordex-dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
