{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kordex-dashboard.fullname" . }}
  labels: {{- include "kordex-dashboard.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ required "ingress.host must be set when ingress.enabled" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName must be set when ingress.enabled" .Values.ingress.tls.secretName | quote }}
  rules:
    - host: {{ required "ingress.host must be set when ingress.enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kordex-dashboard.fullname" . }}
                port:
                  name: http
{{- end }}
