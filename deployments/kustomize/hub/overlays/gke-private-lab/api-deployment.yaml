apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordex-api
  namespace: kordex-management
  labels:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: api
spec:
  # Deliberately held at zero until the restore verifier succeeds.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kordex
      app.kubernetes.io/component: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordex
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: []
      hostAliases:
        - ip: REPLACE_WITH_RESERVED_KEYCLOAK_CLUSTER_IP
          hostnames:
            - keycloak.localhost
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: kordex/control-plane:0.8.0
          imagePullPolicy: IfNotPresent
          command: ["/kordex"]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: otelExporterOtlpEndpoint
            - name: KORDEX_LOCAL_DEVELOPMENT
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kordex-hub-credentials
                  key: databaseURL
            - name: KORDEX_MAINTENANCE_SIGNING_KEY_FILE
              value: /var/run/kordex/maintenanceSigningKey
            - name: KORDEX_AUDIT_SIGNING_KEY_FILE
              value: /var/run/kordex/auditSigningKey
            - name: KORDEX_METRICS_LISTEN_ADDRESS
              value: 127.0.0.1:9090
            - name: KORDEX_LISTEN_ADDRESS
              value: 127.0.0.1:8080
            - name: KORDEX_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcIssuer
            - name: KORDEX_OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAudience
            - name: KORDEX_OIDC_TOKEN_MODE
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcTokenMode
            - name: KORDEX_OIDC_ACCESS_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAccessClientID
            - name: KORDEX_OIDC_ACCESS_REQUIRED_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAccessRequiredScopes
            - name: KORDEX_API_RATE_LIMIT_RPS
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: apiRateLimitRPS
            - name: KORDEX_API_RATE_LIMIT_BURST
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: apiRateLimitBurst
            - name: KORDEX_PRODUCT_NAME
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: productName
            - name: SSL_CERT_FILE
              value: /var/run/kordex/ca/ca.crt
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/kordex
              readOnly: true
            - name: management-ca
              mountPath: /var/run/kordex/ca
              readOnly: true
        - name: tls-proxy
          image: docker.io/nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /readyz
              port: https
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: api-proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: api-tls
              mountPath: /run/kordex-api/tls
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: signing-key
          secret:
            secretName: kordex-hub-credentials
            defaultMode: 0440
            items:
              - key: maintenanceSigningKey
                path: maintenanceSigningKey
              - key: auditSigningKey
                path: auditSigningKey
        - name: management-ca
          secret:
            secretName: kordex-management-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: api-proxy-config
          configMap:
            name: kordex-api-tls-proxy
        - name: api-tls
          secret:
            secretName: kordex-api-tls
            defaultMode: 0440
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
