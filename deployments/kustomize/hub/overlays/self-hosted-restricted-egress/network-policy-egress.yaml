apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kordex-dashboard-egress
  namespace: kordex-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kordex
      app.kubernetes.io/component: dashboard
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # This matches in-cluster routing to ingress-nginx pods. If apiURL resolves
    # to an external load balancer, replace/add its exact destination CIDR.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kordex.io/egress-role: oidc
          podSelector:
            matchLabels:
              kordex.io/egress-role: oidc
      ports:
        - {protocol: TCP, port: 443}
