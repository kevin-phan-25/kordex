apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kordex-api-egress
  namespace: kordex-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kordex
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kordex.io/egress-role: postgres
          podSelector:
            matchLabels:
              kordex.io/egress-role: postgres
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels:
              kordex.io/egress-role: oidc
          podSelector:
            matchLabels:
              kordex.io/egress-role: oidc
      ports:
        - {protocol: TCP, port: 443}
---
