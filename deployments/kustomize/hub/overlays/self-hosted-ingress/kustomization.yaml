apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../self-hosted
  - ingress-settings.yaml
  - ingress.yaml
  - network-policy.yaml
replacements:
  - source:
      kind: ConfigMap
      name: kordex-ingress-settings
      fieldPath: data.apiHost
    targets:
      - select:
          kind: Ingress
          name: kordex-api
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: ConfigMap
          name: kordex-hub-settings
        fieldPaths:
          - data.apiURL
        options:
          delimiter: "://"
          index: 1
  - source:
      kind: ConfigMap
      name: kordex-ingress-settings
      fieldPath: data.dashboardHost
    targets:
      - select:
          kind: Ingress
          name: kordex-dashboard
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: ConfigMap
          name: kordex-hub-settings
        fieldPaths:
          - data.dashboardURL
        options:
          delimiter: "://"
          index: 1
  - source:
      kind: ConfigMap
      name: kordex-ingress-settings
      fieldPath: data.ingressClassName
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.ingressClassName
  - source:
      kind: ConfigMap
      name: kordex-ingress-settings
      fieldPath: data.apiTLSSecretName
    targets:
      - select:
          kind: Ingress
          name: kordex-api
        fieldPaths:
          - spec.tls.0.secretName
  - source:
      kind: ConfigMap
      name: kordex-ingress-settings
      fieldPath: data.dashboardTLSSecretName
    targets:
      - select:
          kind: Ingress
          name: kordex-dashboard
        fieldPaths:
          - spec.tls.0.secretName
