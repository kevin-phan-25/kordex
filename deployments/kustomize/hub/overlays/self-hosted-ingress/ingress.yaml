apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kordex-api
  namespace: kordex-management
  labels:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: api
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.invalid
      secretName: kordex-api-tls
  rules:
    - host: api.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kordex-api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kordex-dashboard
  namespace: kordex-management
  labels:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: dashboard
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.example.invalid
      secretName: kordex-dashboard-tls
  rules:
    - host: dashboard.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kordex-dashboard
                port:
                  name: http
