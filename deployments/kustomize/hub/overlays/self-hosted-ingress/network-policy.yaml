apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kordex-api-ingress
  namespace: kordex-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kordex
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kordex-dashboard-ingress
  namespace: kordex-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kordex
      app.kubernetes.io/component: dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 3000
