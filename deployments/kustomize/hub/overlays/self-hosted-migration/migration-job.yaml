apiVersion: batch/v1
kind: Job
metadata:
  name: kordex-migrate
  namespace: kordex-management
  labels:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordex
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: kordex-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: kordex/control-plane:0.8.0
          imagePullPolicy: IfNotPresent
          command: ["/kordex", "-migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kordex-hub-credentials
                  key: migrationDatabaseURL
            - name: KORDEX_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcIssuer
            - name: KORDEX_OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAudience
            - name: KORDEX_OIDC_TOKEN_MODE
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcTokenMode
            - name: KORDEX_OIDC_ACCESS_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAccessClientID
            - name: KORDEX_OIDC_ACCESS_REQUIRED_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAccessRequiredScopes
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
