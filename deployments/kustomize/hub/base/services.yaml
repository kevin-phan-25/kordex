apiVersion: v1
kind: Service
metadata:
  name: kordex-api
  namespace: kordex-management
spec:
  selector:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: kordex-dashboard
  namespace: kordex-management
spec:
  selector:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
