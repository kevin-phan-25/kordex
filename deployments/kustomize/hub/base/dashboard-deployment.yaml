apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordex-dashboard
  namespace: kordex-management
  labels:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kordex
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordex
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: kordex-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kordex
                    app.kubernetes.io/component: dashboard
      containers:
        - name: dashboard
          image: kordex/dashboard:0.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: KORDEX_PRODUCT_NAME
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: productName
            - name: KORDEX_DASHBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: dashboardURL
            - name: KORDEX_API_URL
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: apiURL
            - name: KORDEX_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcIssuer
            - name: KORDEX_OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcClientID
            - name: KORDEX_OIDC_API_TOKEN_MODE
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: dashboardApiTokenMode
            - name: KORDEX_OIDC_API_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: dashboardApiScopes
            - name: KORDEX_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: kordex-dashboard-identity
                  key: session-secret
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
