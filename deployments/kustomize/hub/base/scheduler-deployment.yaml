apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordex-scheduler
  namespace: kordex-management
  labels:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kordex
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordex
        app.kubernetes.io/component: scheduler
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: kordex-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: kordex/control-plane:0.8.0
          imagePullPolicy: IfNotPresent
          command: ["/kordex-scheduler"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kordex-hub-credentials
                  key: databaseURL
            - name: KORDEX_MAINTENANCE_SIGNING_KEY_FILE
              value: /var/run/kordex/maintenanceSigningKey
            - name: KORDEX_SCHEDULER_METRICS_ADDR
              value: 127.0.0.1:9091
          ports:
            - name: metrics
              containerPort: 9091
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/kordex
              readOnly: true
      volumes:
        - name: signing-key
          secret:
            secretName: kordex-hub-credentials
            defaultMode: 0440
            items:
              - key: maintenanceSigningKey
                path: maintenanceSigningKey
