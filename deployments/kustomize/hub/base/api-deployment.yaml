apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordex-api
  namespace: kordex-management
  labels:
    app.kubernetes.io/name: kordex
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kordex
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordex
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: kordex-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kordex
                    app.kubernetes.io/component: api
      containers:
        - name: api
          image: kordex/control-plane:0.8.0
          imagePullPolicy: IfNotPresent
          command: ["/kordex"]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: otelExporterOtlpEndpoint
            - name: KORDEX_LOCAL_DEVELOPMENT
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kordex-hub-credentials
                  key: databaseURL
            - name: KORDEX_MAINTENANCE_SIGNING_KEY_FILE
              value: /var/run/kordex/maintenanceSigningKey
            - name: KORDEX_AUDIT_SIGNING_KEY_FILE
              value: /var/run/kordex/auditSigningKey
            - name: KORDEX_METRICS_LISTEN_ADDRESS
              value: 127.0.0.1:9090
            - name: KORDEX_LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: KORDEX_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcIssuer
            - name: KORDEX_OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAudience
            - name: KORDEX_OIDC_TOKEN_MODE
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcTokenMode
            - name: KORDEX_OIDC_ACCESS_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAccessClientID
            - name: KORDEX_OIDC_ACCESS_REQUIRED_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: oidcAccessRequiredScopes
            - name: KORDEX_API_RATE_LIMIT_RPS
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: apiRateLimitRPS
            - name: KORDEX_API_RATE_LIMIT_BURST
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: apiRateLimitBurst
            - name: KORDEX_PRODUCT_NAME
              valueFrom:
                configMapKeyRef:
                  name: kordex-hub-settings
                  key: productName
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/kordex
              readOnly: true
      volumes:
        - name: signing-key
          secret:
            secretName: kordex-hub-credentials
            defaultMode: 0440
            items:
              - key: maintenanceSigningKey
                path: maintenanceSigningKey
              - key: auditSigningKey
                path: auditSigningKey
