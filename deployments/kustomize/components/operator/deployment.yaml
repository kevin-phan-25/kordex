apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordex-operator
  namespace: kordex-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kordex-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordex-operator
    spec:
      serviceAccountName: kordex-operator
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: kordex/operator:0.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: KORDEX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KORDEX_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: clusterID
            - name: KORDEX_HUB_PUBLIC_KEYS_FILE
              value: /var/run/kordex-trust/keys.json
            - name: KORDEX_ENABLE_HOST_UPGRADES
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: upgradeEnabled
            - name: KORDEX_ENABLE_GKE_UPGRADES
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: gkeUpgradeEnabled
            - name: KORDEX_UPGRADE_SSH_USER
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: upgradeSSHUser
            - name: KORDEX_UPGRADE_SSH_SECRET
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: upgradeSSHSecret
            - name: KORDEX_UPGRADE_KNOWN_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: upgradeKnownHosts
            - name: KORDEX_UPGRADE_EE_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: upgradeExecutionEnvironmentAllowlist
            - name: KORDEX_UPGRADE_IMAGE_PULL_SECRETS
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: upgradeImagePullSecrets
            - name: KORDEX_ETCD_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: etcdEndpoints
            - name: KORDEX_ETCD_CA_FILE
              value: /var/run/kordex-etcd/ca.crt
            - name: KORDEX_ETCD_CERT_FILE
              value: /var/run/kordex-etcd/tls.crt
            - name: KORDEX_ETCD_KEY_FILE
              value: /var/run/kordex-etcd/tls.key
            - name: KORDEX_ROOK_METRICS_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: kordex-operator-settings
                  key: rookMetricsCAFile
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          volumeMounts:
            - name: hub-trust
              mountPath: /var/run/kordex-trust
              readOnly: true
            - name: etcd-client-tls
              mountPath: /var/run/kordex-etcd
              readOnly: true
            - name: rook-metrics-ca
              mountPath: /var/run/kordex-rook-metrics
              readOnly: true
      volumes:
        - name: hub-trust
          configMap:
            name: kordex-hub-trust
        - name: etcd-client-tls
          secret:
            secretName: kordex-etcd-client
            optional: true
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: rook-metrics-ca
          configMap:
            name: kordex-rook-metrics-ca
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
