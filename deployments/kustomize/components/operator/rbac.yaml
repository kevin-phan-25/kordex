apiVersion: v1
kind: ServiceAccount
metadata:
  name: kordex-operator
  namespace: kordex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kordex-operator
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [pods, persistentvolumes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - nonResourceURLs: [/readyz]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kordex-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kordex-operator
subjects:
  - kind: ServiceAccount
    name: kordex-operator
    namespace: kordex-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kordex-upgrade-runner
  namespace: kordex-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kordex-operator-heartbeats
  namespace: kube-node-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kordex-operator-heartbeats
  namespace: kube-node-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kordex-operator-heartbeats
subjects:
  - kind: ServiceAccount
    name: kordex-operator
    namespace: kordex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kordex-operator
  namespace: kordex-system
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [operations.kordex.local]
    resources: [nodemaintenances]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [operations.kordex.local]
    resources: [maintenancepolicies, maintenancecampaigns]
    verbs: [get, list, watch]
  - apiGroups: [operations.kordex.local]
    resources: [nodemaintenances/status, maintenancepolicies/status, maintenancecampaigns/status]
    verbs: [get, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-operator]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-hub-connection]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kordex-operator
  namespace: kordex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kordex-operator
subjects:
  - kind: ServiceAccount
    name: kordex-operator
    namespace: kordex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kordex-operator-ledger
  namespace: kordex-operations-ledger
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-maintenance-cluster-slot]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kordex-operator-ledger
  namespace: kordex-operations-ledger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kordex-operator-ledger
subjects:
  - kind: ServiceAccount
    name: kordex-operator
    namespace: kordex-system
