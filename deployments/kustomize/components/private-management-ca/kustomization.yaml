apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kordex-agent
      namespace: kordex-system
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kordex-agent
        namespace: kordex-system
      spec:
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: KORDEX_CA_FILE
                    value: /var/run/kordex/ca/ca.crt
                volumeMounts:
                  - name: management-ca
                    mountPath: /var/run/kordex/ca
                    readOnly: true
            volumes:
              - name: management-ca
                secret:
                  secretName: kordex-management-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
