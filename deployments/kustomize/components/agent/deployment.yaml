apiVersion: apps/v1
kind: Deployment
metadata:
  name: kordex-agent
  namespace: kordex-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kordex-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kordex-agent
    spec:
      serviceAccountName: kordex-agent
      terminationGracePeriodSeconds: 80
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: kordex/agent:0.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: kordex-agent-settings
                  key: otelExporterOtlpEndpoint
            - name: KORDEX_ENABLE_MAINTENANCE
              valueFrom:
                configMapKeyRef:
                  name: kordex-agent-settings
                  key: maintenanceEnabled
            - name: KORDEX_CONTROL_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: kordex-agent-settings
                  key: controlPlaneURL
            - name: KORDEX_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: kordex-agent-settings
                  key: clusterID
            - name: KORDEX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: KORDEX_STATE_SECRET
              value: kordex-agent-identity
            - name: KORDEX_STATE_SECRET_FILE
              value: /var/run/kordex/identity/state.json
            - name: KORDEX_LEASE_NAME
              value: kordex-agent
            - name: KORDEX_ENROLLMENT_TOKEN_FILE
              value: /var/run/kordex/enrollment/token
          volumeMounts:
            - name: enrollment
              mountPath: /var/run/kordex/enrollment
              readOnly: true
            - name: identity
              mountPath: /var/run/kordex/identity
              readOnly: true
      volumes:
        - name: enrollment
          secret:
            secretName: kordex-enrollment
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: identity
          secret:
            secretName: kordex-agent-identity
            defaultMode: 0440
            optional: true
            items:
              - key: state.json
                path: state.json
