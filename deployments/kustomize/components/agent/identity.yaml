# The identity Secret has no data in this manifest. The agent writes and owns
# its durable identity data. Re-applying this metadata must preserve that data.
apiVersion: v1
kind: Secret
metadata:
  name: kordex-agent-identity
  namespace: kordex-system
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: kordex-agent
  namespace: kordex-system
