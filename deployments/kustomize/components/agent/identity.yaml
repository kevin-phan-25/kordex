# The identity Secret has no identity payload in this manifest. Before starting
# the agent, seed its public empty-state CAS value with
# scripts/seed_agent_identity_secret.py. Re-applying this metadata preserves
# the agent-owned identity data.
apiVersion: v1
kind: Secret
metadata:
  name: kordex-agent-identity
  namespace: kordex-system
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: kordex-agent
  namespace: kordex-system
