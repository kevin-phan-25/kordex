apiVersion: v1
kind: ServiceAccount
metadata:
  name: kordex-agent
  namespace: kordex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kordex-agent
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system, kordex-system]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes, storageclasses]
    verbs: [list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations, validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [list]
  - nonResourceURLs: [/version, /api, /api/*, /apis, /apis/*]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kordex-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kordex-agent
subjects:
  - kind: ServiceAccount
    name: kordex-agent
    namespace: kordex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kordex-agent-discovery
  namespace: kube-system
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kordex-agent-discovery
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kordex-agent-discovery
subjects:
  - kind: ServiceAccount
    name: kordex-agent
    namespace: kordex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kordex-agent
  namespace: kordex-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kordex-agent-identity]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-agent, kordex-hub-connection]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kordex-operator-capabilities]
    verbs: [get]
  - apiGroups: [operations.kordex.local]
    resources: [maintenancepolicies]
    verbs: [get, list]
  - apiGroups: [operations.kordex.local]
    resources: [nodemaintenances]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kordex-agent
  namespace: kordex-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kordex-agent
subjects:
  - kind: ServiceAccount
    name: kordex-agent
    namespace: kordex-system
