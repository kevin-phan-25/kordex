apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/operator
configMapGenerator:
  - name: kordex-hub-trust
    namespace: kordex-system
    files:
      - keys.json
images:
  - name: kordex-operator
    newName: us-central1-docker.pkg.dev/PROJECT_ID/kordex/kordex-operator
    newTag: "0.4.0"
patches:
  - path: operator-settings.patch.yaml
