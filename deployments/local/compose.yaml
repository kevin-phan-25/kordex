name: kordex-local
services:
  postgres:
    image: ${KORDEX_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: kordex
      POSTGRES_USER: kordex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kordex -d kordex"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile
    command: ["-migrate"]
    environment: &app-environment
      # Values in this URL must be URI-safe; use the documented hex generator.
      DATABASE_URL: postgres://kordex:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kordex?sslmode=disable
      KORDEX_ADMIN_TOKEN: ${KORDEX_ADMIN_TOKEN:?Set KORDEX_ADMIN_TOKEN in .env}
      KORDEX_LISTEN_ADDRESS: 0.0.0.0:8080
      KORDEX_LOCAL_DEVELOPMENT: "true"
      KORDEX_PRODUCT_NAME: ${KORDEX_PRODUCT_NAME:-Kordex}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  control-plane:
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile
    environment: *app-environment
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres-data:
