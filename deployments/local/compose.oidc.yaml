# Opt-in OIDC stack. Keep compose.yaml and compose.campaigns.yaml as the
# existing bootstrap configuration; this adds Keycloak and a separate OIDC API
# endpoint while enabling TLS on the shared PostgreSQL data volume.
services:
  postgres:
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgres-tls/postgres.crt
      - -c
      - ssl_key_file=/run/postgres-tls/postgres.key
    volumes:
      - ${KORDEX_LOCAL_OIDC_DIR:?Run scripts/local-oidc-init.sh first}/certs/postgres.crt:/run/postgres-tls/postgres.crt:ro,Z
      - ${KORDEX_LOCAL_OIDC_DIR:?Run scripts/local-oidc-init.sh first}/certs/postgres.key:/run/postgres-tls/postgres.key:ro,Z

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm", "--https-port=8443"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KORDEX_KEYCLOAK_ADMIN_USERNAME:?Run scripts/local-oidc-init.sh first}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KORDEX_KEYCLOAK_ADMIN_PASSWORD:?Run scripts/local-oidc-init.sh first}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://keycloak.localhost:8443
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /run/keycloak-tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/keycloak-tls/keycloak.key
    ports:
      - "127.0.0.1:8443:8443"
      - "[::1]:8443:8443"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ${KORDEX_LOCAL_OIDC_DIR:?Run scripts/local-oidc-init.sh first}/certs/keycloak.crt:/run/keycloak-tls/keycloak.crt:ro,Z
      - ${KORDEX_LOCAL_OIDC_DIR:?Run scripts/local-oidc-init.sh first}/certs/keycloak.key:/run/keycloak-tls/keycloak.key:ro,Z
      - ./keycloak/kordex-realm.json:/opt/keycloak/data/import/kordex-realm.json:ro,Z
    networks:
      default:
        aliases:
          - keycloak.localhost
    restart: unless-stopped
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  control-plane-oidc:
    image: localhost/kordex-local-control-plane:local-oidc
    environment:
      DATABASE_URL: postgres://kordex:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployments/local/.env}@postgres:5432/kordex?sslmode=verify-full&sslrootcert=/run/kordex-oidc/ca.crt
      KORDEX_LISTEN_ADDRESS: 0.0.0.0:8080
      KORDEX_METRICS_LISTEN_ADDRESS: 0.0.0.0:9090
      KORDEX_OIDC_ISSUER: https://keycloak.localhost:8443/realms/kordex
      KORDEX_OIDC_AUDIENCE: kordex-dashboard
      SSL_CERT_FILE: /run/kordex-oidc/ca.crt
      KORDEX_PRODUCT_NAME: ${KORDEX_PRODUCT_NAME:-Kordex}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ${KORDEX_LOCAL_OIDC_DIR:?Run scripts/local-oidc-init.sh first}/certs/ca.crt:/run/kordex-oidc/ca.crt:ro,Z
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  keycloak-data:

networks:
  default:
    name: kordex-local_default
