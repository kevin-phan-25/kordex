# Add to compose.yaml after creating an isolated development signing key.
services:
  control-plane:
    environment:
      KORDEX_MAINTENANCE_SIGNING_KEY_FILE: /var/run/kordex/maintenance-key
    volumes:
      - type: bind
        source: ${KORDEX_MAINTENANCE_SIGNING_KEY_FILE:?Set an absolute path to the development signing key}
        target: /var/run/kordex/maintenance-key
        read_only: true
  scheduler:
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile
    entrypoint: ["/kordex-scheduler"]
    environment:
      KORDEX_LOCAL_DEVELOPMENT: "true"
      DATABASE_URL: postgres://kordex:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kordex?sslmode=disable
      KORDEX_MAINTENANCE_SIGNING_KEY_FILE: /var/run/kordex/maintenance-key
    volumes:
      - type: bind
        source: ${KORDEX_MAINTENANCE_SIGNING_KEY_FILE:?Set an absolute path to the development signing key}
        target: /var/run/kordex/maintenance-key
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
