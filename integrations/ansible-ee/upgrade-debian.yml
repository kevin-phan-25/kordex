---
- name: Kordex Debian family upgrade
  hosts: kordex_target
  gather_facts: true
  become: true
  vars:
    kordex_request: "{{ lookup('file', '/etc/kordex/request.json') | from_json }}"
    kordex_policy: "{{ kordex_request.policy }}"
    kordex_reboot_timeout_seconds: "{{ (kordex_policy.rebootTimeout | int) // 1000000000 }}"
  tasks:
    - name: Check requested operating system identity
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - (ansible_facts.distribution == 'Ubuntu' and kordex_policy.osId == 'ubuntu') or (ansible_facts.distribution == 'Debian' and kordex_policy.osId == 'debian')
          - ansible_facts.distribution_major_version == kordex_policy.osMajor
          - kordex_policy.osMinor == '' or (ansible_facts.distribution_version.split('.') | length > 1 and ansible_facts.distribution_version.split('.')[1] == kordex_policy.osMinor)
          - (kordex_policy.osId == 'ubuntu' and kordex_policy.osMajor == '24' and kordex_policy.osMinor == '04') or (kordex_policy.osId == 'debian' and kordex_policy.osMajor == '13' and kordex_policy.osMinor == '')
          - kordex_policy.osId != 'debian' or kordex_policy.osPointRelease is match('^13\\.[0-9]+$')
          - (kordex_policy.actionMarkerVersion | default(0) | int) == 1
        fail_msg: unsupported operating system identity or required host action marker is missing

    - name: Read the Debian point-release identity
      ansible.builtin.command:
        argv: [cat, /etc/debian_version]
      register: kordex_debian_point_release
      changed_when: false
      when: kordex_policy.osId == 'debian'

    - name: Record exact distribution release for qualification evidence
      ansible.builtin.set_fact:
        kordex_os_point_release: "{{ (kordex_debian_point_release.stdout | trim) if kordex_policy.osId == 'debian' else ansible_facts.distribution_version }}"

    - name: Require a Debian 13 point release
      ansible.builtin.assert:
        that:
          - kordex_os_point_release is match('^13\\.[0-9]+$')
          - kordex_os_point_release == kordex_policy.osPointRelease
        fail_msg: Debian qualification requires a recorded Trixie point release
      when: kordex_policy.osId == 'debian'

    - name: Verify systemd and read cgroup v2 controller availability
      ansible.builtin.command:
        argv: [cat, /sys/fs/cgroup/cgroup.controllers]
      register: kordex_cgroup_controllers
      changed_when: false
      failed_when: false

    - name: Inspect cgroup v1 controllers
      ansible.builtin.stat:
        path: "/sys/fs/cgroup/{{ item }}"
        follow: false
      loop: [cpu, memory, pids]
      register: kordex_cgroup_v1_paths

    - name: Require systemd, amd64, and usable CPU, memory, and PID cgroups
      ansible.builtin.assert:
        that:
          - ansible_facts.service_mgr == 'systemd'
          - ansible_facts.architecture in ['x86_64', 'amd64']
          - (kordex_cgroup_controllers.rc == 0 and 'cpu' in kordex_cgroup_controllers.stdout.split() and 'memory' in kordex_cgroup_controllers.stdout.split() and 'pids' in kordex_cgroup_controllers.stdout.split()) or (kordex_cgroup_controllers.rc != 0 and kordex_cgroup_v1_paths.results | map(attribute='stat.isdir') | list | min)
        fail_msg: K3s host prerequisites require systemd, amd64, and cpu/memory/pids cgroup controllers

    - name: Record cgroup mode for the verified platform receipt
      ansible.builtin.set_fact:
        kordex_cgroup_mode: "{{ 'v2' if kordex_cgroup_controllers.rc == 0 else 'v1' }}"

    - name: Verify K3s kernel modules and bridge networking controls
      ansible.builtin.stat:
        path: "/sys/module/{{ item }}"
        follow: false
      loop: [overlay, br_netfilter]
      register: kordex_k3s_modules
      when: kordex_policy.osId == 'debian'

    - name: Probe iptables for K3s host networking
      ansible.builtin.command:
        argv: [iptables, --version]
      register: kordex_iptables_probe
      changed_when: false
      when: kordex_policy.osId == 'debian'

    - name: Require K3s kernel modules and iptables
      ansible.builtin.assert:
        that:
          - kordex_k3s_modules.results | map(attribute='stat.exists') | list | min
          - kordex_iptables_probe.rc == 0
        fail_msg: Debian qualification requires overlay and br_netfilter kernel support
      when: kordex_policy.osId == 'debian'

    - name: Read machine identity
      ansible.builtin.slurp:
        src: /etc/machine-id
      register: kordex_machine_id_file

    - name: Read boot identity before the action
      ansible.builtin.command:
        argv: [cat, /proc/sys/kernel/random/boot_id]
      changed_when: false
      register: kordex_boot_id_before_command

    - name: Normalize initial host identity
      ansible.builtin.set_fact:
        kordex_machine_id_before: "{{ kordex_machine_id_file.content | b64decode | trim }}"
        kordex_boot_id_before: "{{ kordex_boot_id_before_command.stdout | trim }}"

    - name: Validate preflighted identity before package changes
      ansible.builtin.assert:
        that:
          - kordex_machine_id_before is match('^[0-9a-fA-F]{32}$')
          - kordex_boot_id_before is match('^[0-9a-fA-F-]{36}$')
          - kordex_request.phase == 'preflight' or kordex_machine_id_before == kordex_request.node.machineId
          - kordex_request.phase in ['preflight', 'inspect'] or kordex_boot_id_before == kordex_request.node.bootId
        fail_msg: host identity differs from the signed maintenance target

    - name: Build fixed offline Debian artifact paths
      ansible.builtin.set_fact:
        kordex_artifact_paths: "{{ kordex_policy.packages | map(attribute='artifactSHA256') | map('regex_replace', '^(.*)$', '/var/cache/kordex/artifacts/\\1.deb') | list }}"
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Inspect offline Debian artifact directory without following links
      ansible.builtin.stat:
        path: /var/cache/kordex/artifacts
        follow: false
      register: kordex_artifact_directory
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Require root-owned non-writable offline Debian artifact directory
      ansible.builtin.assert:
        that:
          - kordex_artifact_directory.stat.isdir | default(false)
          - kordex_artifact_directory.stat.pw_name == 'root'
          - kordex_artifact_directory.stat.mode in ['0700', '0750', '0755']
        fail_msg: offline Debian artifact directory is missing or unsafe
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Inspect staged offline Debian artifacts without following links
      ansible.builtin.stat:
        path: "/var/cache/kordex/artifacts/{{ item.artifactSHA256 }}.deb"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: "{{ kordex_policy.packages }}"
      register: kordex_artifact_stats
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Require each offline Debian artifact to match its pinned digest
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - item.stat.pw_name == 'root'
          - item.stat.checksum == item.item.artifactSHA256
          - item.stat.mode in ['0400', '0440', '0444', '0600', '0640', '0644']
        fail_msg: offline Debian artifact is missing, unsafe, or does not match the signed package digest
      loop: "{{ kordex_artifact_stats.results }}"
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Verify offline Debian artifact package identity
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - -f
          - "/var/cache/kordex/artifacts/{{ item.artifactSHA256 }}.deb"
          - Package
          - Version
          - Architecture
      loop: "{{ kordex_policy.packages }}"
      register: kordex_artifact_metadata
      changed_when: false
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Require offline Debian package name, version, and architecture to match policy
      ansible.builtin.assert:
        that:
          - item.stdout_lines | length == 3
          - item.stdout_lines[0] == item.item.name.split(':')[0]
          - item.stdout_lines[1] == item.item.version
          - "':' not in item.item.name or item.stdout_lines[2] == item.item.name.split(':')[1]"
        fail_msg: offline Debian artifact package identity differs from the signed package pin
      loop: "{{ kordex_artifact_metadata.results }}"
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Inspect isolated per-operation APT archive cache without following links
      ansible.builtin.stat:
        path: "/var/cache/kordex/artifacts/.apt-cache-{{ kordex_request.operationId }}"
        follow: false
      register: kordex_apt_archive_cache_stat
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Require any existing per-operation APT archive cache to be private and root-owned
      ansible.builtin.assert:
        that:
          - not (kordex_apt_archive_cache_stat.stat.exists | default(false)) or (kordex_apt_archive_cache_stat.stat.isdir | default(false))
          - not (kordex_apt_archive_cache_stat.stat.exists | default(false)) or kordex_apt_archive_cache_stat.stat.pw_name == 'root'
          - not (kordex_apt_archive_cache_stat.stat.exists | default(false)) or kordex_apt_archive_cache_stat.stat.mode == '0700'
        fail_msg: per-operation APT archive cache is not a private root-owned directory
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Create isolated per-operation APT archive cache
      ansible.builtin.file:
        path: "/var/cache/kordex/artifacts/.apt-cache-{{ kordex_request.operationId }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: kordex_policy.schemaVersion == 2 and kordex_request.phase in ['preflight', 'apply']

    - name: Resolve offline Debian dependency transaction without downloads or removals
      ansible.builtin.command:
        # Avoid ambient host and prior-operation caches. Package files passed
        # to this transaction remain the policy-digest-pinned artifact set.
        argv: "{{ ['apt-get', '--simulate', '--no-download', '--no-remove', '-o', 'Dir::Cache::archives=/var/cache/kordex/artifacts/.apt-cache-' ~ kordex_request.operationId ~ '/', 'install'] + kordex_artifact_paths }}"
      changed_when: false
      when: kordex_request.phase == 'preflight' and kordex_policy.schemaVersion == 2

    - name: Remove the isolated APT archive cache after successful preflight simulation
      ansible.builtin.file:
        path: "/var/cache/kordex/artifacts/.apt-cache-{{ kordex_request.operationId }}"
        state: absent
      when: kordex_request.phase == 'preflight' and kordex_policy.schemaVersion == 2

    # Resolve every exact package pin against the host's existing APT cache
    # before the operator cordons the node. Check mode prevents installation,
    # and update_cache=false keeps preflight offline and side-effect free.
    - name: Verify pinned package versions resolve from the local APT cache
      ansible.builtin.apt:
        name: "{{ item.name }}={{ item.version }}"
        state: present
        update_cache: false
        fail_on_autoremove: true
        allow_downgrade: false
        allow_change_held_packages: false
        install_recommends: false
        lock_timeout: 30
      check_mode: true
      loop: "{{ kordex_policy.packages }}"
      when: kordex_request.phase == 'preflight' and kordex_policy.schemaVersion == 1

    - name: Define durable operation marker path
      ansible.builtin.set_fact:
        kordex_marker_enabled: "{{ (kordex_policy.actionMarkerVersion | default(1) | int) == 1 }}"
        kordex_marker_directory: /var/lib/kordex/operations
        kordex_marker_path: "/var/lib/kordex/operations/{{ kordex_request.operationId }}.json"
      when: kordex_request.phase in ['apply', 'reboot', 'inspect']

    - name: Inspect durable marker directory without following links
      ansible.builtin.stat:
        path: "{{ kordex_marker_directory }}"
        follow: false
      register: kordex_marker_directory_stat
      when: kordex_marker_enabled | default(false)

    - name: Require an existing marker directory to be a root-owned directory
      ansible.builtin.assert:
        that:
          - kordex_marker_directory_stat.stat.isdir | default(false)
          - kordex_marker_directory_stat.stat.pw_name == 'root'
        fail_msg: durable marker directory is not a root-owned directory
      when: kordex_marker_enabled | default(false) and kordex_marker_directory_stat.stat.exists

    - name: Inspect existing durable operation marker
      ansible.builtin.stat:
        path: "{{ kordex_marker_path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      register: kordex_marker_stat
      when: kordex_marker_enabled | default(false)

    - name: Require an existing marker to be a small root-owned regular file
      ansible.builtin.assert:
        that:
          - kordex_marker_stat.stat.isreg | default(false)
          - kordex_marker_stat.stat.pw_name == 'root'
          - kordex_marker_stat.stat.mode == '0600'
          - kordex_marker_stat.stat.size <= 131072
        fail_msg: durable operation marker is not a valid private regular file
      when: kordex_marker_enabled | default(false) and kordex_marker_stat.stat.exists

    - name: Read existing durable operation marker
      ansible.builtin.slurp:
        src: "{{ kordex_marker_path }}"
      register: kordex_marker_file
      when: kordex_marker_enabled | default(false) and kordex_marker_stat.stat.exists

    - name: Decode existing durable operation marker
      ansible.builtin.set_fact:
        kordex_marker: "{{ kordex_marker_file.content | b64decode | from_json }}"
      when: kordex_marker_enabled | default(false) and kordex_marker_stat.stat.exists

    - name: Validate marker file ownership type and operation binding
      ansible.builtin.assert:
        that:
          - kordex_marker_stat.stat.isreg | default(false)
          - kordex_marker_stat.stat.pw_name == 'root'
          - (kordex_marker_stat.stat.mode | default('')) == '0600'
          - kordex_marker.version == 1
          - kordex_marker.operationId == kordex_request.operationId
          - kordex_marker.actionDigest == kordex_request.planDigest
          - kordex_marker.nodeUid == kordex_request.node.uid
          - kordex_marker.machineId == kordex_machine_id_before
          - kordex_marker.bootId is match('^[0-9a-fA-F-]{36}$')
          - kordex_marker.packages | sort(attribute='name') == kordex_policy.packages | sort(attribute='name')
          - kordex_marker.phase in ['apply-intent', 'packages-verified', 'reboot-intent', 'reboot-verified']
          - "kordex_marker.sequence == {'apply-intent': 1, 'packages-verified': 2, 'reboot-intent': 3, 'reboot-verified': 4}[kordex_marker.phase]"
          - kordex_request.phase != 'reboot' or (kordex_marker.phase == 'packages-verified' and kordex_marker.sequence == 2 and kordex_marker.bootId == kordex_boot_id_before and (kordex_marker.rebootRequired | bool))
        fail_msg: existing host marker does not match this operation or cannot be replayed safely
      when: kordex_marker_enabled | default(false) and kordex_marker_stat.stat.exists

    - name: Refuse to replay package apply when marker already exists
      ansible.builtin.assert:
        that:
          - not kordex_marker_stat.stat.exists
        fail_msg: durable operation marker already exists; inspect or recover instead of replaying package apply
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Require verified apply marker before reboot phase
      ansible.builtin.assert:
        that:
          - kordex_marker_stat.stat.exists
          - kordex_marker.phase == 'packages-verified'
          - kordex_marker.sequence == 2
          - kordex_marker.bootId == kordex_boot_id_before
        fail_msg: reboot requires the exact verified package marker on the same boot
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Ensure durable marker directory exists with root-only access
      ansible.builtin.file:
        path: "{{ kordex_marker_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: kordex_marker_enabled | default(false) and kordex_request.phase in ['apply', 'reboot']

    - name: Verify durable marker directory permissions before host changes
      ansible.builtin.stat:
        path: "{{ kordex_marker_directory }}"
        follow: false
      register: kordex_marker_directory_secure_stat
      when: kordex_marker_enabled | default(false) and kordex_request.phase in ['apply', 'reboot']

    - name: Refuse host changes unless marker directory is private and root-owned
      ansible.builtin.assert:
        that:
          - kordex_marker_directory_secure_stat.stat.isdir | default(false)
          - kordex_marker_directory_secure_stat.stat.pw_name == 'root'
          - kordex_marker_directory_secure_stat.stat.mode == '0700'
        fail_msg: durable marker directory permissions are not secure
      when: kordex_marker_enabled | default(false) and kordex_request.phase in ['apply', 'reboot']

    - name: Write package apply intent before changing host packages
      ansible.builtin.copy:
        content: "{{ {'version': 1, 'operationId': kordex_request.operationId, 'actionDigest': kordex_request.planDigest, 'nodeUid': kordex_request.node.uid, 'machineId': kordex_machine_id_before, 'bootId': kordex_boot_id_before, 'phase': 'apply-intent', 'sequence': 1, 'packages': kordex_policy.packages, 'updatedAt': ansible_date_time.iso8601} | to_nice_json }}\n"
        dest: "{{ kordex_marker_path }}"
        owner: root
        group: root
        mode: "0600"
        force: false
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Flush package apply intent to the host filesystem
      ansible.builtin.command:
        argv: [/usr/bin/sync, --file-system, "{{ kordex_marker_directory }}"]
      changed_when: false
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Read back persisted package apply intent
      ansible.builtin.slurp:
        src: "{{ kordex_marker_path }}"
      register: kordex_apply_intent_file
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Validate persisted package apply intent before APT
      ansible.builtin.assert:
        that:
          - kordex_apply_intent.version == 1
          - kordex_apply_intent.operationId == kordex_request.operationId
          - kordex_apply_intent.actionDigest == kordex_request.planDigest
          - kordex_apply_intent.nodeUid == kordex_request.node.uid
          - kordex_apply_intent.machineId == kordex_machine_id_before
          - kordex_apply_intent.bootId == kordex_boot_id_before
          - kordex_apply_intent.phase == 'apply-intent'
          - kordex_apply_intent.sequence == 1
          - kordex_apply_intent.packages | sort(attribute='name') == kordex_policy.packages | sort(attribute='name')
        fail_msg: durable apply intent did not persist exactly; refusing package changes
      vars:
        kordex_apply_intent: "{{ kordex_apply_intent_file.content | b64decode | from_json }}"
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Track package apply intent in memory
      ansible.builtin.set_fact:
        kordex_marker:
          version: 1
          operationId: "{{ kordex_request.operationId }}"
          actionDigest: "{{ kordex_request.planDigest }}"
          nodeUid: "{{ kordex_request.node.uid }}"
          machineId: "{{ kordex_machine_id_before }}"
          bootId: "{{ kordex_boot_id_before }}"
          phase: apply-intent
          sequence: 1
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Read installed Debian package versions before mutation
      ansible.builtin.command:
        argv:
          - dpkg-query
          - --show
          - --showformat=${db:Status-Status} ${Version}
          - --
          - "{{ item.name }}"
        expand_argument_vars: false
      loop: "{{ kordex_policy.packages }}"
      register: kordex_baseline_queries
      changed_when: false
      failed_when: kordex_baseline_queries.rc not in [0, 1]
      when: kordex_request.phase == 'preflight'

    - name: Record installed Debian package baseline
      ansible.builtin.set_fact:
        kordex_baseline_packages: "{{ kordex_baseline_packages | default({}) | combine({item.item.name: (item.stdout.split(' ', 1)[1] if item.rc == 0 and item.stdout.startswith('installed ') else '')}) }}"
      loop: "{{ kordex_baseline_queries.results | default([]) }}"
      when: kordex_request.phase == 'preflight'

    - name: Prepare the read-only preflight receipt
      ansible.builtin.set_fact:
        kordex_receipt:
          operationId: "{{ kordex_request.operationId }}"
          planDigest: "{{ kordex_request.planDigest }}"
          nodeUid: "{{ kordex_request.node.uid }}"
          machineId: "{{ kordex_machine_id_before }}"
          bootIdBefore: "{{ kordex_boot_id_before }}"
          bootIdAfter: "{{ kordex_boot_id_before }}"
          osFamily: "debian"
          osId: "{{ kordex_policy.osId }}"
          osVersion: "{{ ansible_facts.distribution_version }}"
          osPointRelease: "{{ kordex_os_point_release }}"
          architecture: amd64
          serviceManager: "{{ ansible_facts.service_mgr }}"
          cgroupMode: "{{ kordex_cgroup_mode }}"
          selinuxMode: NotApplicable
          firewallState: not-applicable
          kernelVersion: "{{ ansible_facts.kernel }}"
          expectedKernelVersion: "{{ kordex_policy.expectedKernelVersion | default('') }}"
          rebooted: false
          packages: {}
          baselinePackages: "{{ kordex_baseline_packages }}"
      when: kordex_request.phase == 'preflight'

    - name: Write the read-only preflight receipt on the EE controller
      ansible.builtin.copy:
        content: "{{ kordex_receipt | to_nice_json }}"
        dest: /var/run/kordex/result.json
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      when: kordex_request.phase == 'preflight'

    - name: End after read-only host preflight
      ansible.builtin.meta: end_play
      when: kordex_request.phase == 'preflight'

    - name: Install exact requested package versions
      ansible.builtin.apt:
        name: "{{ item.name }}={{ item.version }}"
        state: present
        update_cache: false
        fail_on_autoremove: true
        allow_downgrade: false
        allow_change_held_packages: false
        install_recommends: false
        lock_timeout: 120
      loop: "{{ kordex_policy.packages }}"
      when: kordex_request.phase == 'apply' and kordex_policy.schemaVersion == 1

    - name: Install only hash-verified local Debian artifacts without repository downloads
      ansible.builtin.command:
        argv: "{{ ['apt-get', '--assume-yes', '--no-download', '--no-remove', '-o', 'Dir::Cache::archives=/var/cache/kordex/artifacts/.apt-cache-' ~ kordex_request.operationId ~ '/', 'install'] + kordex_artifact_paths }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: kordex_request.phase == 'apply' and kordex_policy.schemaVersion == 2

    - name: Remove the isolated APT archive cache after successful package application
      ansible.builtin.file:
        path: "/var/cache/kordex/artifacts/.apt-cache-{{ kordex_request.operationId }}"
        state: absent
      when: kordex_request.phase == 'apply' and kordex_policy.schemaVersion == 2

    - name: Check the host reboot-required marker
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: kordex_reboot_required_marker
      when: kordex_request.phase in ['apply', 'reboot', 'inspect']

    - name: Determine whether the immutable policy requires a reboot
      ansible.builtin.set_fact:
        kordex_kernel_packages: "{{ kordex_policy.packages | selectattr('name', 'search', '^(kernel(-|:|$)|linux-(image|modules|headers|generic|virtual|lowlatency|oem|signed|azure|gcp|kvm|cloud-tools|tools|firmware)(-|:|$))') | list }}"
        kordex_kernel_reboot_pending: "{{ (kordex_kernel_packages | length > 0) and (kordex_request.phase != 'inspect' or kordex_boot_id_before == kordex_request.node.bootId or ((kordex_policy.expectedKernelVersion | default('')) != ansible_facts.kernel)) }}"
        kordex_host_reboot_required: "{{ (kordex_kernel_reboot_pending | bool) or (kordex_reboot_required_marker.stat.exists | default(false)) }}"
        kordex_reboot_expected: "{{ (kordex_request.phase == 'apply' and (kordex_policy.reboot == 'Required' or (kordex_policy.reboot == 'IfNeeded' and (kordex_host_reboot_required | bool)))) or (kordex_request.phase == 'reboot' and (kordex_request.rebootAuthorized | bool)) or (kordex_request.phase == 'inspect' and ((kordex_host_reboot_required | bool) or (kordex_policy.reboot == 'Required' and kordex_boot_id_before == kordex_request.node.bootId))) }}"
        kordex_reboot_requested: "{{ kordex_request.phase == 'reboot' }}"

    - name: Reject host state that requires reboot when policy prohibits it
      ansible.builtin.assert:
        that:
          - not (kordex_host_reboot_required | bool)
        fail_msg: host package state requires reboot but the signed policy prohibits reboot
      when: kordex_request.phase in ['apply', 'inspect'] and kordex_policy.reboot == 'Never'

    - name: Validate that reboot is required by the immutable policy
      ansible.builtin.assert:
        that:
          - kordex_request.phase != 'reboot' or kordex_reboot_expected | bool
        fail_msg: reboot is not required by the signed package policy
      when: kordex_request.phase in ['apply', 'reboot', 'inspect']

    - name: Persist reboot intent before starting the host reboot
      ansible.builtin.copy:
        content: "{{ kordex_marker | combine({'phase': 'reboot-intent', 'sequence': 3, 'updatedAt': ansible_date_time.iso8601}) | to_nice_json }}\n"
        dest: "{{ kordex_marker_path }}"
        owner: root
        group: root
        mode: "0600"
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Flush reboot intent to the host filesystem
      ansible.builtin.command:
        argv: [/usr/bin/sync, --file-system, "{{ kordex_marker_directory }}"]
      changed_when: false
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Read back persisted reboot intent
      ansible.builtin.slurp:
        src: "{{ kordex_marker_path }}"
      register: kordex_reboot_intent_file
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Validate persisted reboot intent before rebooting
      ansible.builtin.assert:
        that:
          - kordex_reboot_intent.version == 1
          - kordex_reboot_intent.operationId == kordex_request.operationId
          - kordex_reboot_intent.actionDigest == kordex_request.planDigest
          - kordex_reboot_intent.nodeUid == kordex_request.node.uid
          - kordex_reboot_intent.machineId == kordex_machine_id_before
          - kordex_reboot_intent.bootId == kordex_boot_id_before
          - kordex_reboot_intent.phase == 'reboot-intent'
          - kordex_reboot_intent.sequence == 3
        fail_msg: durable reboot intent did not persist exactly; refusing reboot
      vars:
        kordex_reboot_intent: "{{ kordex_reboot_intent_file.content | b64decode | from_json }}"
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Track reboot intent marker in memory
      ansible.builtin.set_fact:
        kordex_marker: "{{ kordex_marker | combine({'phase': 'reboot-intent', 'sequence': 3}) }}"
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Reboot and wait for the same machine to return when requested
      ansible.builtin.reboot:
        reboot_timeout: "{{ kordex_reboot_timeout_seconds | int }}"
        connect_timeout: 10
        post_reboot_delay: 2
      when: kordex_request.phase == 'reboot'

    - name: Refresh host facts after package changes or reboot
      ansible.builtin.setup:
        gather_subset: [min]
      when: kordex_request.phase in ['apply', 'reboot', 'inspect']

    - name: Refresh package facts after updates and optional reboot
      ansible.builtin.package_facts:
        manager: apt

    - name: Confirm each pinned package version is installed
      ansible.builtin.assert:
        that:
          - item.name in ansible_facts.packages
          - item.version in (ansible_facts.packages[item.name] | map(attribute='version') | list)
        fail_msg: requested package version is not installed
      loop: "{{ kordex_policy.packages }}"

    - name: Re-read host machine identity after the action
      ansible.builtin.slurp:
        src: /etc/machine-id
      register: kordex_machine_id_after_file

    - name: Read boot identity after the action
      ansible.builtin.command:
        argv: [cat, /proc/sys/kernel/random/boot_id]
      changed_when: false
      register: kordex_boot_id_after_command

    - name: Normalize verified host identity and package versions
      ansible.builtin.set_fact:
        kordex_machine_id_after: "{{ kordex_machine_id_after_file.content | b64decode | trim }}"
        kordex_boot_id_after: "{{ kordex_boot_id_after_command.stdout | trim }}"
        kordex_verified_packages: "{{ kordex_verified_packages | default({}) | combine({item.name: (ansible_facts.packages[item.name] | selectattr('version', 'equalto', item.version) | map(attribute='version') | first)}) }}"
      loop: "{{ kordex_policy.packages }}"

    - name: Confirm machine continuity and reboot evidence
      ansible.builtin.assert:
        that:
          - kordex_machine_id_after == kordex_machine_id_before
          - kordex_boot_id_after is match('^[0-9a-fA-F-]{36}$')
          - (not (kordex_reboot_requested | bool)) or kordex_boot_id_after != kordex_boot_id_before
          - (kordex_reboot_requested | bool) or kordex_boot_id_after == kordex_boot_id_before
          - kordex_request.phase != 'reboot' or not (kordex_policy.expectedKernelVersion | default('')) or ansible_facts.kernel == kordex_policy.expectedKernelVersion
        fail_msg: post-upgrade host identity or reboot evidence is inconsistent

    - name: Persist package verification only after all host checks pass
      ansible.builtin.copy:
        content: "{{ {'version': 1, 'operationId': kordex_request.operationId, 'actionDigest': kordex_request.planDigest, 'nodeUid': kordex_request.node.uid, 'machineId': kordex_machine_id_after, 'bootId': kordex_boot_id_before, 'phase': 'packages-verified', 'sequence': 2, 'packages': kordex_policy.packages, 'kernelVersion': ansible_facts.kernel, 'rebootRequired': kordex_reboot_expected | bool, 'updatedAt': ansible_date_time.iso8601} | to_nice_json }}\n"
        dest: "{{ kordex_marker_path }}"
        owner: root
        group: root
        mode: "0600"
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Flush package verification to the host filesystem
      ansible.builtin.command:
        argv: [/usr/bin/sync, --file-system, "{{ kordex_marker_directory }}"]
      changed_when: false
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Track package verification marker in memory
      ansible.builtin.set_fact:
        kordex_marker: "{{ kordex_marker | combine({'phase': 'packages-verified', 'sequence': 2, 'machineId': kordex_machine_id_after, 'kernelVersion': ansible_facts.kernel, 'rebootRequired': kordex_reboot_expected | bool}) }}"
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'apply'

    - name: Persist reboot verification only after all host checks pass
      ansible.builtin.copy:
        content: "{{ kordex_marker | combine({'machineId': kordex_machine_id_after, 'bootId': kordex_boot_id_after, 'phase': 'reboot-verified', 'sequence': 4, 'kernelVersion': ansible_facts.kernel, 'updatedAt': ansible_date_time.iso8601}) | to_nice_json }}\n"
        dest: "{{ kordex_marker_path }}"
        owner: root
        group: root
        mode: "0600"
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Flush reboot verification to the host filesystem
      ansible.builtin.command:
        argv: [/usr/bin/sync, --file-system, "{{ kordex_marker_directory }}"]
      changed_when: false
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Track reboot verification marker in memory
      ansible.builtin.set_fact:
        kordex_marker: "{{ kordex_marker | combine({'machineId': kordex_machine_id_after, 'bootId': kordex_boot_id_after, 'phase': 'reboot-verified', 'sequence': 4, 'kernelVersion': ansible_facts.kernel}) }}"
      when: kordex_marker_enabled | default(false) and kordex_request.phase == 'reboot'

    - name: Prepare the Kordex execution receipt
      ansible.builtin.set_fact:
        kordex_receipt:
          operationId: "{{ kordex_request.operationId }}"
          planDigest: "{{ kordex_request.planDigest }}"
          nodeUid: "{{ kordex_request.node.uid }}"
          machineId: "{{ kordex_machine_id_after }}"
          bootIdBefore: "{{ kordex_boot_id_before }}"
          bootIdAfter: "{{ kordex_boot_id_after }}"
          osFamily: "debian"
          osId: "{{ kordex_policy.osId }}"
          osVersion: "{{ ansible_facts.distribution_version }}"
          osPointRelease: "{{ kordex_os_point_release }}"
          architecture: amd64
          serviceManager: "{{ ansible_facts.service_mgr }}"
          cgroupMode: "{{ kordex_cgroup_mode }}"
          selinuxMode: NotApplicable
          firewallState: not-applicable
          kernelVersion: "{{ ansible_facts.kernel }}"
          expectedKernelVersion: "{{ kordex_policy.expectedKernelVersion | default('') }}"
          rebooted: "{{ kordex_reboot_requested | bool }}"
          rebootRequired: "{{ kordex_reboot_expected | bool }}"
          packages: "{{ kordex_verified_packages }}"

    - name: Refresh durable marker checksum for the EE receipt
      ansible.builtin.stat:
        path: "{{ kordex_marker_path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      register: kordex_marker_final_stat
      when: kordex_marker_enabled | default(false)

    - name: Attach durable action marker evidence to the execution receipt
      ansible.builtin.set_fact:
        kordex_receipt: "{{ kordex_receipt | combine({'actionMarker': {'version': 1, 'operationId': kordex_request.operationId, 'actionDigest': kordex_request.planDigest, 'nodeUid': kordex_request.node.uid, 'machineId': kordex_marker.machineId, 'bootId': kordex_marker.bootId, 'phase': kordex_marker.phase, 'sequence': kordex_marker.sequence, 'sha256': kordex_marker_final_stat.stat.checksum}}) }}"
      when: kordex_marker_enabled | default(false) and kordex_marker_final_stat is defined and (kordex_request.phase != 'inspect' or kordex_marker_stat.stat.exists)

    - name: Write a structured receipt on the EE controller
      ansible.builtin.copy:
        content: "{{ kordex_receipt | to_nice_json }}"
        dest: /var/run/kordex/result.json
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
